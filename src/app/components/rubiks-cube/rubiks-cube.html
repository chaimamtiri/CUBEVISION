
<div class="cube-container" #canvasContainer></div>

<div class="move-controls">

  <!-- Face droite -->
  <button type="button" (click)="rotateFace('R')">R</button>
  <button type="button" (click)="rotateFace(&quot;R'&quot;)">R'</button>
  <button type="button" (click)="rotateFace('R2')">R2</button>

  <!-- Face gauche -->
  <button type="button" (click)="rotateFace('L')">L</button>
  <button type="button" (click)="rotateFace(&quot;L'&quot;)">L'</button>
  <button type="button" (click)="rotateFace('L2')">L2</button>

  <!-- Face supérieure -->
  <button type="button" (click)="rotateFace('U')">U</button>
  <button type="button" (click)="rotateFace(&quot;U'&quot;)">U'</button>
  <button type="button" (click)="rotateFace('U2')">U2</button>

  
<!-- Face inférieure -->
<button type="button" (click)="rotateFace('D')">D</button>
<button type="button" (click)="rotateFace(&quot;D'&quot;)">D'</button>
<button type="button" (click)="rotateFace('D2')">D2</button>


<!-- Face avant -->
<button type="button" (click)="rotateFace('F')">F</button>
<button type="button" (click)="rotateFace(&quot;F'&quot;)">F'</button>
<button type="button" (click)="rotateFace('F2')">F2</button>

<button type="button" (click)="rotateFace('B')">B</button>
<button type="button" (click)="rotateFace(&quot;B'&quot;)">B'</button>
<button type="button" (click)="rotateFace('B2')">B2</button>

<button type="button" (click)="startScramble()">
  🔀 Scramble
</button>

@if (scrambleNotation) {
  <div class="scramble-display">
    <strong>Scramble :</strong>
    <p>{{ scrambleNotation }}</p>
  </div>
}

</div>
